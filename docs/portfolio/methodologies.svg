<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="490" viewBox="0 0 1240 490" role="img" aria-labelledby="title desc"><title id="title">Methodology interpretation at a glance</title><desc id="desc">Legacy Prime is a preserved baseline, Peer Reference may be definition-incomplete, and Evidence-Gated Prime evaluates only admissible pressure and ignition evidence. Canonical Phase 3A is a separate rule-evaluation system.</desc><rect width="1240" height="490" fill="#0b1524"/>
<text x="48" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="29" fill="#edf5fb" font-weight="750">THREE DISTINCT RESEARCH PROJECTIONS</text>
<text x="48" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">Comparisons are descriptive, not predictions or trading recommendations.</text>
<rect x="42" y="135" width="346" height="235" rx="18" fill="#16283d" stroke="#6fa9e8" stroke-width="1.7"/><rect x="62" y="158" width="11" height="11" rx="5.5" fill="#6fa9e8"/><text x="84" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#edf5fb" font-weight="700">Legacy Prime</text><text x="63" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6fa9e8" font-weight="650">PRESERVED BASELINE</text><text x="63" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">Original reference projection</text><text x="63" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">Retained for comparison</text><text x="63" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">Not validated forecasting</text>
<rect x="447" y="135" width="346" height="235" rx="18" fill="#16283d" stroke="#f3c47c" stroke-width="1.7"/><rect x="467" y="158" width="11" height="11" rx="5.5" fill="#f3c47c"/><text x="489" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#edf5fb" font-weight="700">Peer Reference</text><text x="468" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f3c47c" font-weight="650">EXPLICIT INCOMPLETENESS</text><text x="468" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">Reference conditions can be</text><text x="468" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">not fully specified; never</text><text x="468" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">invent missing input evidence</text>
<rect x="852" y="135" width="346" height="235" rx="18" fill="#16283d" stroke="#52c8b5" stroke-width="1.7"/><rect x="872" y="158" width="11" height="11" rx="5.5" fill="#52c8b5"/><text x="894" y="171" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#edf5fb" font-weight="700">Evidence-Gated Prime</text><text x="873" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52c8b5" font-weight="650">ADMISSIBILITY FIRST</text><text x="873" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">Pressure + Ignition assessed</text><text x="873" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">only with eligible inputs</text><text x="873" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">65% supported weight floor</text>
<rect x="42" y="398" width="1156" height="54" rx="13" fill="#1d3245" stroke="#36516c"/>
<text x="64" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#edf5fb" font-weight="700">Canonical Phase 3A</text>
<text x="307" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#b4c4d6" font-weight="400">separate preregistered rule analysis</text>
<text x="764" y="431" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#52c8b5" font-weight="650">PASS  /  FAIL  /  UNKNOWN</text>
</svg>