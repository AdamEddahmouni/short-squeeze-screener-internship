<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-labelledby="title desc">
<title id="title">Short Squeeze Research Screener data flow</title>
<desc id="desc">Live providers pass through typed field evidence and research methodologies to read-only browser views and API. A separate sanitized 13-case fixture path serves the same views without provider connections or live scoring.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9 Z" fill="#41c1b0"/></marker></defs>
<rect width="1240" height="620" fill="#0b1524"/>
<rect x="20" y="20" width="1200" height="580" rx="30" fill="none" stroke="#293a50"/>
<text x="60" y="80" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="33" fill="#ffffff" font-weight="750">HOW THE SCREENER WORKS</text>
<text x="60" y="114" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#9caec4" font-weight="400">Evidence stays traceable. Missing or conflicted inputs stay explicit.</text>
<text x="60" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#58c9b6" font-weight="700">LIVE-CAPABLE MODES</text>
<rect x="55" y="183" width="224" height="151" rx="19" fill="#142339" stroke="#29796f" stroke-width="1.5"/>
<text x="75" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="650">Provider observations</text>
<text x="75" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Finviz  •  SEC  •  News</text>
<text x="75" y="268" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Finnhub  •  optional IBKR</text>
<text x="75" y="295" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#7f9bb2" font-weight="400">Network + entitlements</text>
<rect x="326" y="183" width="254" height="151" rx="19" fill="#142339" stroke="#334967" stroke-width="1.5"/>
<text x="347" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="650">Typed evidence</text>
<text x="347" y="245" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Times • units • provenance</text>
<text x="347" y="269" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Freshness • admissibility</text>
<text x="347" y="296" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#58c9b6" font-weight="650">Unknown ≠ zero</text>
<rect x="628" y="183" width="258" height="151" rx="19" fill="#142339" stroke="#334967" stroke-width="1.5"/>
<text x="648" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="650">Independent methods</text>
<text x="648" y="243" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Legacy • peer reference</text>
<text x="648" y="267" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Evidence-Gated Prime</text>
<text x="648" y="297" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#b4c4d5" font-weight="400">Phase 3A rules (separate)</text>
<rect x="934" y="183" width="249" height="151" rx="19" fill="#142339" stroke="#29796f" stroke-width="1.5"/>
<text x="954" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="650">Research surfaces</text>
<text x="954" y="245" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Scanner  /</text>
<text x="954" y="269" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Advanced Research</text>
<text x="954" y="296" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#58c9b6" font-weight="400">Versioned read API</text>
<path d="M279 255 H326" fill="none" stroke="#41c1b0" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M580 255 H628" fill="none" stroke="#41c1b0" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M886 255 H934" fill="none" stroke="#41c1b0" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="60" y="394" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#e9b674" font-weight="700">OFFLINE FROZEN-DEMO MODE</text>
<rect x="55" y="415" width="224" height="116" rx="19" fill="#142339" stroke="#886842" stroke-width="1.5"/>
<text x="75" y="446" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="650">Sanitized 13 cases</text>
<text x="75" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Fixed Phase 3A outcomes</text>
<text x="75" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#e9b674" font-weight="650">No live market data</text>
<rect x="326" y="415" width="254" height="116" rx="19" fill="#142339" stroke="#886842" stroke-width="1.5"/>
<text x="347" y="447" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="650">Frozen research API</text>
<text x="347" y="476" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#b4c4d5" font-weight="400">Deterministic • local</text>
<text x="347" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#e9b674" font-weight="650">No brokerage session</text>
<path d="M279 470 H326" fill="none" stroke="#41c1b0" stroke-width="3"  marker-end="url(#arrow)"/>
<path d="M580 472 H1045 V342" fill="none" stroke="#41c1b0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
<text x="640" y="461" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#e9b674" font-weight="600">Served to the same interfaces</text>
<text x="60" y="567" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#95a9c2" font-weight="400">Research-only • no orders • no account access • no validated forecasting</text>
</svg>