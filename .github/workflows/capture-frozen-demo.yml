# Produce authentic screenshots from the repository's actual FROZEN_DEMO app.
# Deliberately restricted to the presentation branch, not main.
name: Capture verified frozen-demo assets

on:
  push:
    branches:
      - portfolio/frozen-demo-showcase-20261118
    paths-ignore:
      - "docs/portfolio/assets/**"

permissions:
  contents: write

concurrency:
  group: frozen-demo-asset-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frozen application dependencies
        working-directory: short-squeeze-core
        run: python -m pip install -e ".[test]"

      - name: Validate frozen-demo API and research boundaries
        working-directory: short-squeeze-core
        env:
          SQUEEZE_APP_MODE: FROZEN_DEMO
        run: python tools/integration_acceptance.py --mode frozen

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start the actual credential-free frozen app
        env:
          SQUEEZE_APP_MODE: FROZEN_DEMO
        shell: bash
        run: |
          set -euo pipefail
          (cd short-squeeze-core && python -m apps.research_screener --mode FROZEN_DEMO --port 8787 --no-browser > "$RUNNER_TEMP/frozen-server.log" 2>&1) &
          ready=0
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/frozen-server.log"
            exit 1
          fi

      - name: Capture browser screenshots and video
        run: node tools/capture_frozen_demo.mjs

      - name: Upload visual assets for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-frozen-demo-assets
          path: docs/portfolio/assets/
          retention-days: 30

      - name: Commit real captures to presentation branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portfolio/assets/
          if ! git diff --cached --quiet; then
            git commit -m "docs: add verified frozen-demo screenshots and walkthrough"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
